# Publishes the contents of app/ to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# This cannot be automated: configure-pages can create the Pages site only
# with a PAT, since GITHUB_TOKEN gets "Resource not accessible by
# integration" on that endpoint. Not worth a PAT for a one-click setting.
name: Deploy app to Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
